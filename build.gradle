/**
 * Used when working with this plugin.
 */
plugins {
	id "java-gradle-plugin"
	id "se.bjurr.gradle.bundle-gradle-binaryplugin"
}

/**
 * Dependencies needed by the plugin in src/main/groovy
 */
dependencies {
	implementation gradleApi()
	implementation "com.github.ben-manes:gradle-versions-plugin:0.54.0"

	testImplementation gradleTestKit()
	testImplementation platform("org.junit:junit-bom:6.1.3")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	testImplementation "org.assertj:assertj-core:3.27.7"
}

javaExtension {
	javaVersion = 17
}

test {
	useJUnitPlatform()
}

// Verified with a scratch GradleRunner project: showUpdateableDependencies/updateDependencies
// discard the configuration cache every run. Some of that is upstream (gradle-versions-plugin's
// own DependencyUpdatesTask uses Task.project at execution time), and some is ours (the
// outputFormatter closure captures the live Project to resolve candidate dependency versions).
// Declare it honestly as unsupported rather than guessing "true" and risking the Portal
// revoking the compatibility badge.
gradlePlugin {
	plugins.named("thePlugin") {
		compatibility {
			features {
				configurationCache = false
			}
		}
	}
}
